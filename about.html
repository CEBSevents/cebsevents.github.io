<!DOCTYPE html>
<html lang="en">
<head>
    <!-- The head section contains metadata (invisible information about the page) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- The title appears in the browser tab -->
    <title>About - Alumni Cell</title>
</head>
<body>
    <!-- The body contains the visible content of the webpage -->
    
    <header>
        <!-- Headings range from h1 (largest) to h6 (smallest) -->
        <h1>Welcome to the Alumni Cell</h1>
        <!-- p stands for paragraph -->
        <p>Connecting past students with the future.</p> 
    </header>

    <main>
        <!-- Sections help organize your content logically -->
        <section>
            <h2>About Us</h2>
            <p>This is where we will put information about the college alumni cell.</p>
            
            <!-- An example of an unordered list (bullet points) -->
            <ul>
                <li>Networking Events</li>
                <li>Mentorship Programs</li>
                <li>Guest Lectures</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Alumni Cell</p>
    </footer>

</body>
</html>
